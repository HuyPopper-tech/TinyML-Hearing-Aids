; Arm Ethos-U Vela 5.1 Regor profiles for the M55M1 APROM/SRAM01 experiment.
; OffChipFlash is Vela's logical read-only AXI port name.  The firmware keeps
; APROM at 0x00100000; this name does not select external flash hardware.

[System_Config.Ethos_U55_M55M1_FLASH_X0.300]
core_clock=220e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_ports_used=1
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
OffChipFlash_clock_scale=0.300
OffChipFlash_ports_used=1
OffChipFlash_burst_length=32
OffChipFlash_read_latency=32
OffChipFlash_write_latency=32

[System_Config.M55M1_aprom_x050]
inherit=System_Config.Ethos_U55_M55M1_FLASH_X0.300
OffChipFlash_clock_scale=0.500

[System_Config.M55M1_aprom_x100]
inherit=System_Config.Ethos_U55_M55M1_FLASH_X0.300
OffChipFlash_clock_scale=1.000

[System_Config.M55M1_sram01_x100]
inherit=System_Config.M55M1_aprom_x100

[Memory_Mode.Shared_1024K]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0
arena_cache_size=1048576

[Memory_Mode.M55M1_aprom_x050]
inherit=Memory_Mode.Shared_1024K

[Memory_Mode.M55M1_aprom_x100]
inherit=Memory_Mode.Shared_1024K

[Memory_Mode.M55M1_sram01_x100]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0
arena_cache_size=1048576
