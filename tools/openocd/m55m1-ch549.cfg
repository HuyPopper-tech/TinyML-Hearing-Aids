# Use the target and numicro_dap flash driver shipped by OpenNuvoton.
source [find interface/ch549-cmsis-dap.cfg]

# The SW-DP ID is distinct from the Cortex-M55 CPUID in the vendor default.
set CPUDAPID 0x4c013477
source [find target/numicroM55.cfg]

# The vendor target sets 4 MHz; this probe/board combination was tested at 400 kHz.
adapter speed 400
reset_config none
source [find m55m1-flash.tcl]

# Restore Secure transactions after Cortex-M examination chooses its AP policy.
cortex_m.cpu configure -event examine-end {cortex_m.dap apcsw 0 0x40000000}
cortex_m.cpu configure -event gdb-attach {m55m1_halt}
# The vendor work area overlaps the application's DTCM vector table/data.
cortex_m.cpu configure -work-area-backup 1
