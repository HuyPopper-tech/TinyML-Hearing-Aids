# Memory access only, without Cortex-M examination or a flash bank.
source [find interface/ch549-cmsis-dap.cfg]
source [find target/swj-dp.tcl]
swj_newdap m55m1 cpu -irlen 4 -expected-id 0x4c013477
dap create m55m1.dap -chain-position m55m1.cpu -adiv6
target create m55m1.mem mem_ap -dap m55m1.dap -ap-num 0
